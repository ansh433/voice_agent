name: voice-service-desk

x-postgres-environment: &postgres-environment
  POSTGRES_USER: motor_mitra
  POSTGRES_PASSWORD: motor_mitra
  POSTGRES_INITDB_ARGS: --data-checksums

x-postgres-healthcheck: &postgres-healthcheck
  test:
    - CMD-SHELL
    - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 5s

services:
  postgres:
    image: postgres:16
    environment:
      <<: *postgres-environment
      POSTGRES_DB: motor_mitra
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  postgres_test:
    image: postgres:16
    environment:
      <<: *postgres-environment
      POSTGRES_DB: motor_mitra_test
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

volumes:
  postgres-data:
